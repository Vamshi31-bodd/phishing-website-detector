<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Phishing Website Detector</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🔐 Phishing Website Detector</h1>

        <p class="subtitle">
            Check whether a website URL is potentially phishing.
        </p>

        <form method="POST">

            <input
                type="text"
                name="url"
                placeholder="Enter website URL..."
                value="{{ url }}"
                required
            >

            <button type="submit">
                Check Website
            </button>

        </form>

        {% if error %}
<div class="error">
    {{ error }}
</div>
{% endif %}


        {% if result %}

        <div class="result {% if result == 'Phishing Website' %}danger{% else %}safe{% endif %}">

            <h2>{{ result }}</h2>

            <p>
                Confidence:
                <strong>{{ "%.2f"|format(confidence) }}%</strong>
            </p>

        </div>

        {% endif %}

    </div>

</body>

</html>
